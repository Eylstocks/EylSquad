<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#EDF0EA;--panel:#F8FAF6;--field:#FFFFFF;--hover:#E3E8E0;--ink:#16262B;--ink2:#4B5B5F;--muted:#7C898B;--line:#D3D9D0;--line2:#B9C2B7;--accent:#0F5C63;--onaccent:#F4FAF9;--win:#1E7A4C;--winbg:#D9EEDF;--loss:#B23A32;--lossbg:#F5DBD7;--warn:#83630F;--warnbg:#F2E7C7}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#11191C;--panel:#172125;--field:#1C282D;--hover:#22303A;--ink:#E6ECE8;--ink2:#A9B7B5;--muted:#7C8B8C;--line:#2A373B;--line2:#3B4B50;--accent:#5CC2C9;--onaccent:#0B1A1C;--win:#56C48B;--winbg:#163325;--loss:#EE7B72;--lossbg:#3A1E1C;--warn:#D9B75B;--warnbg:#34290F}}
:root[data-theme="dark"]{--bg:#11191C;--panel:#172125;--field:#1C282D;--hover:#22303A;--ink:#E6ECE8;--ink2:#A9B7B5;--muted:#7C8B8C;--line:#2A373B;--line2:#3B4B50;--accent:#5CC2C9;--onaccent:#0B1A1C;--win:#56C48B;--winbg:#163325;--loss:#EE7B72;--lossbg:#3A1E1C;--warn:#D9B75B;--warnbg:#34290F}
*{box-sizing:border-box}
[hidden]{display:none !important}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 "Schibsted Grotesk",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-variant-numeric:tabular-nums}
h1{font-size:24px;font-weight:600;letter-spacing:-.015em;margin:0}
h2{font-size:15px;font-weight:600;margin:0 0 10px}
p{margin:0}
.app{display:grid;grid-template-columns:208px minmax(0,1fr);min-height:100vh}
.side{padding:22px 14px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{font-weight:600;font-size:17px;margin:0 10px 18px;letter-spacing:-.01em}
.navb{display:block;padding:8px 10px;border-radius:8px;border:0;background:none;color:var(--ink2);font:inherit;font-weight:500;cursor:pointer;text-align:left;width:100%}
.navb:hover{background:var(--hover)}
.navb.on{background:var(--hover);color:var(--ink)}
.side .note{margin:auto 10px 0;font-size:12.5px;color:var(--muted)}
main{padding:28px 32px 90px;max-width:1140px;width:100%}
.btn{font:inherit;font-weight:500;font-size:14px;padding:8px 14px;border-radius:8px;border:1px solid var(--line2);background:var(--panel);color:var(--ink);cursor:pointer}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.btn.primary:hover{filter:brightness(1.1)}
.btn.sm{padding:5px 10px;font-size:13px}
.btn.link{border:0;background:none;color:var(--accent);padding:4px 2px}
.btn.danger{color:var(--loss)}
.btn:disabled{opacity:.5;cursor:default}
.icon{border:0;background:none;color:var(--muted);padding:4px;border-radius:6px;cursor:pointer;line-height:0}
.icon:hover{background:var(--hover);color:var(--ink)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.top{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.sub{color:var(--ink2);font-size:14px;margin-top:2px}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.chip{font:inherit;font-size:13px;padding:4px 11px;border-radius:99px;border:1px solid var(--line2);background:var(--field);color:var(--ink2);cursor:pointer}
.chip:hover{border-color:var(--ink2)}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--onaccent)}
.chip.bad.on{background:var(--loss);border-color:var(--loss);color:#fff}
.chip.static{cursor:default;padding:2px 9px;font-size:12px;background:none}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.strip{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-bottom:16px}
.strip>div{padding:14px 18px;border-left:1px solid var(--line)}
.strip>div:first-child{border-left:0}
.k{font-size:12.5px;color:var(--ink2);font-weight:500}
.big{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.2}
.win{color:var(--win)}.loss{color:var(--loss)}.mut{color:var(--muted)}
.pill{font-size:12px;font-weight:500;padding:2px 9px;border-radius:99px;display:inline-block}
.pill.win{background:var(--winbg)}.pill.loss{background:var(--lossbg)}.pill.open,.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.even{background:var(--hover);color:var(--ink2)}
.tablewrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:14px}
.tbl th{font-weight:500;color:var(--ink2);text-align:left;padding:10px 7px;border-bottom:1px solid var(--line);font-size:12.5px;white-space:nowrap}
.tbl td{padding:12px 7px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tr[data-open]{cursor:pointer}
.tbl tr[data-open]:hover td{background:var(--hover)}
.n{text-align:right}
.sym{font-weight:600}
.callout{padding:12px 16px;border-radius:10px;background:var(--warnbg);color:var(--warn);display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:16px;font-size:14px}
.callout.bad{background:var(--lossbg);color:var(--loss)}
.callout ul{margin:4px 0 0;padding-left:18px}
.empty{padding:44px 20px;text-align:center}
.empty h2{font-size:18px}
.empty p{color:var(--ink2);margin:4px auto 16px;max-width:420px}
label.f{display:block;font-size:12.5px;color:var(--ink2);font-weight:500}
label.f>span{display:block;margin-bottom:4px}
input,select,textarea{width:100%;font:inherit;font-size:14px;padding:8px 10px;border:1px solid var(--line2);border-radius:6px;background:var(--field);color:var(--ink)}
textarea{resize:vertical;min-height:64px}
input.bad,select.bad{border-color:var(--loss)}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.sec{padding:20px 0;border-top:1px solid var(--line)}
.sec:first-of-type{border-top:0}
.ex{display:grid;grid-template-columns:88px 1.3fr 1fr 70px 1fr 1fr 34px;gap:8px;align-items:end;margin-bottom:8px}
.hint{font-size:13px;color:var(--muted);margin-top:6px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:28px}
.rows{width:100%;border-collapse:collapse;font-size:14px}
.rows td{padding:6px 0;border-bottom:1px solid var(--line)}
.rows td:last-child{text-align:right;font-weight:500}
.rows tr:last-child td{border-bottom:0}
.shots{display:flex;gap:8px;flex-wrap:wrap}
.shot{position:relative}
.shot img{width:120px;height:84px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;display:block;background:var(--hover)}
.shot button{position:absolute;top:4px;right:4px;border:0;border-radius:50%;width:22px;height:22px;background:var(--ink);color:var(--bg);cursor:pointer;line-height:1;font-size:14px}
.drop{border:1px dashed var(--line2);border-radius:8px;padding:12px;color:var(--muted);font-size:13px;margin-top:8px}
.mini{width:150px;padding:4px 10px;font-size:13px;border-radius:99px}
.svgbox svg{width:100%;height:auto;display:block}
.svgbox.narrow svg{max-width:440px}
.svgbox.chartbox svg{max-width:680px}
.svgbox text{font:12px "Schibsted Grotesk",system-ui,sans-serif;fill:var(--ink2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:8px;display:flex;gap:14px;align-items:center;font-size:14px;z-index:50}
#toast button{background:none;border:0;color:inherit;font:inherit;font-weight:600;text-decoration:underline;cursor:pointer;padding:0}
#lb{position:fixed;inset:0;background:rgba(0,0,0,.82);display:flex;align-items:center;justify-content:center;z-index:60;cursor:zoom-out}
#lb img{max-width:94vw;max-height:90vh;border-radius:6px}
@media (max-width:820px){
.app{grid-template-columns:minmax(0,1fr)}
.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:0;border-bottom:1px solid var(--line);padding:12px}
.brand{margin:0 8px 0 0}.navb{width:auto}.side .note{display:none}
main{padding:18px 14px 80px}
.strip{grid-template-columns:repeat(2,minmax(0,1fr))}
.strip>div:nth-child(3){border-left:0}
.strip>div:nth-child(n+3){border-top:1px solid var(--line)}
.ex{grid-template-columns:1fr 1fr 1fr}
.two{grid-template-columns:1fr}
}

.grp{font-size:12.5px;color:var(--muted);font-weight:500;margin:0 0 6px}
.acct{display:grid;grid-template-columns:repeat(3,minmax(0,1fr)) 1.5fr;gap:12px;align-items:center;padding:12px 18px;margin-bottom:16px}
.acct .formula{text-align:right;font-size:13px;color:var(--ink2)}
.big2{font-size:18px;font-weight:600;letter-spacing:-.01em;line-height:1.3}
.strip5{display:grid;grid-template-columns:1.3fr repeat(4,minmax(0,1fr));margin-bottom:16px}
.strip5>div{padding:14px 18px;border-left:1px solid var(--line)}
.strip5>div:first-child{border-left:0}
.curvehead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:6px}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-bottom:14px}
.card{padding:16px 18px}
.card h2{margin-bottom:10px}
.brow{display:grid;grid-template-columns:110px minmax(0,1fr) 76px 36px;gap:8px;align-items:center;font-size:13px;margin:7px 0}
.trk{position:relative;height:10px}
.trk:before{content:"";position:absolute;left:50%;top:-3px;bottom:-3px;width:1px;background:var(--line2)}
.bar{position:absolute;top:0;height:10px;border-radius:3px}
.heat{border-collapse:collapse;font-size:13px}
.heat th{font-weight:500;color:var(--ink2);padding:4px 6px;text-align:center;font-size:12px}
.heat td{padding:3px}
.heat td span{display:block;text-align:center;border-radius:6px;padding:4px 6px;min-width:52px;line-height:1.25}
.heat td small{display:block;font-size:11px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr)) 96px;gap:6px}
.dh{font-size:12px;color:var(--ink2);text-align:center;font-weight:500}
.day{min-height:74px;padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);text-align:left;font:inherit;font-size:12.5px;color:var(--ink2);cursor:pointer;display:block;width:100%}
.day b{display:block;font-size:13px;font-weight:600;color:var(--ink);margin-bottom:2px}
.day.w{background:var(--winbg);border-color:transparent;color:var(--win)}.day.w b{color:var(--win)}
.day.l{background:var(--lossbg);border-color:transparent;color:var(--loss)}.day.l b{color:var(--loss)}
.day.sel{outline:2px solid var(--accent);outline-offset:1px}
.day.mu{background:transparent;border-color:transparent;cursor:default}
.day.today b{text-decoration:underline}
.wk{padding:6px 8px;border-radius:8px;border:1px solid var(--line);background:var(--panel);font-size:12.5px}
@media (max-width:820px){
.acct{grid-template-columns:repeat(3,minmax(0,1fr))}.acct .formula{grid-column:1/-1;text-align:left}
.strip5{grid-template-columns:repeat(2,minmax(0,1fr))}.strip5>div:nth-child(odd){border-left:0}.strip5>div:nth-child(n+3){border-top:1px solid var(--line)}
.cal{grid-template-columns:repeat(7,minmax(0,1fr)) 58px;gap:3px}.day{min-height:58px;padding:3px;font-size:10.5px;overflow:hidden}.day b{font-size:12px}.wk{padding:4px;font-size:10.5px;overflow:hidden}.day small{display:none}.brow{grid-template-columns:84px minmax(0,1fr) 70px 32px}
}

  <!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trade journal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  
/* Login Overlay Styles */
#login-overlay {
  position: fixed;
  top: 0; left: 0; width: 100vw; height: 100vh;
  background: rgba(15, 23, 42, 0.95);
  display: flex; align-items: center; justify-content: center;
  z-index: 9999;
}
.login-card {
  background: #1e293b; color: #f8fafc; padding: 2rem;
  border-radius: 12px; border: 1px solid #334155;
  width: 320px; display: flex; flex-direction: column; gap: 1rem;
  box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
  font-family: inherit;
}
.login-card input {
  background: #0f172a; border: 1px solid #475569; color: #fff;
  padding: 0.75rem; border-radius: 6px; outline: none;
}
.login-card button {
  background: #2563eb; color: #fff; border: none; padding: 0.75rem;
  border-radius: 6px; font-weight: bold; cursor: pointer;
}
.login-card button:hover { background: #1d4ed8; }
</style>
</head>
</style>

<body>
  <!-- Login Popup Overlay -->
  <div id="login-overlay" style="display: none;">
    <div class="login-card">
      <h3 style="margin: 0; text-align: center;">Trade Journal Access</h3>
      <input type="email" id="auth-email" placeholder="Email" />
      <input type="password" id="auth-password" placeholder="Password" />
      <button onclick="handleLogin()">Log In</button>
      <div id="auth-error" style="color: #ef4444; font-size: 0.85rem; text-align: center;"></div>
    </div>
  </div>

  <!-- Your existing app HTML structure continues here... -->
<div class="app" id="root">
  <nav class="side" aria-label="Main">
    <div class="brand">Trade journal</div>
    <button class="navb" data-go="dashboard">Dashboard</button>
    <button class="navb" data-go="stats">Stats</button>
    <button class="navb" data-go="calendar">Calendar</button>
    <button class="navb" data-go="form">New trade</button>
    <button class="navb" data-go="account">Account</button>
    <p class="note">All times are New York time.</p>
  </nav>
  <main id="main"></main>
</div>
<div id="toast" hidden></div>
<div id="lb" hidden></div>

<script>
var EMOTIONS=['Calm','Confident','Focused','FOMO','Anxious','Impatient','Greedy','Frustrated','Bored','Unsure'];
var BREAKERS=['Moved stop','No setup','Revenge trade'];
var DEF_SETUPS=['Reversal','Breakout','Pullback','Trend continuation','Range'];
var DEF_TAGS=['Moved stop','Chased entry','Exited early','Oversized','No setup','Revenge trade'];
var DIRS={option:[['short put','Short put'],['long put','Long put'],['long call','Long call'],['short call','Short call']],stock:[['long','Long'],['short','Short']]};
var ICON={view:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>',edit:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16v4z"/><path d="M13.5 6.5l4 4"/></svg>',trash:'<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>'};

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function uid(){return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3)}
function cap(s){return s?s.charAt(0).toUpperCase()+s.slice(1):''}
function nyNow(){var p={};new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}).formatToParts(new Date()).forEach(function(x){p[x.type]=x.value});return{date:p.year+'-'+p.month+'-'+p.day,time:p.hour+':'+p.minute+':'+p.second}}
function addDays(d,n){var x=new Date(d+'T12:00:00');x.setDate(x.getDate()+n);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')}
function daysBetween(a,b){return Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/86400000)}
function fmtDate(d){if(!d)return'—';var p=d.split('-');return(+p[1])+'/'+(+p[2])+'/'+p[0]}
function fmtTime(t){if(!t)return'';var p=t.split(':');var h=+p[0];return((h%12)||12)+':'+p[1]+(p[2]?':'+p[2]:'')+' '+(h<12?'AM':'PM')}
function money(n,dp){if(n==null||isNaN(n))return'—';dp=dp==null?2:dp;return(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('en-US',{minimumFractionDigits:dp,maximumFractionDigits:dp})}
function sMoney(n){if(n==null||isNaN(n))return'—';return(n>0?'+':'')+money(n)}
function num(n,dp){if(n===''||n==null||isNaN(n))return'—';return Number(n).toFixed(dp==null?2:dp)}
function pctFmt(x){var t=(+x).toFixed(2).replace(/\.?0+$/,'');return t+'%'}
function fmtHold(sec){if(sec<60)return sec+'s';var m=Math.floor(sec/60),s=sec%60;if(m<60)return m+'m'+(s?' '+s+'s':'');var h=Math.floor(m/60);m=m%60;if(h<24)return h+'h'+(m?' '+m+'m':'')+(s?' '+s+'s':'');var d=Math.floor(h/24);h=h%24;return d+'d'+(h?' '+h+'h':'')+(m?' '+m+'m':'')}
function fmtHoldOld(min){if(min<1)return'Under 1m';if(min<60)return min+'m';if(min<1440)return Math.floor(min/60)+'h '+(min%60)+'m';return Math.floor(min/1440)+'d '+Math.floor((min%1440)/60)+'h'}

function typeLabel(t){return t.market==='option'?cap(t.dir)+' '+num(t.strike):cap(t.dir)}
function calc(t){
  var mult=t.market==='option'?100:1,entrySide=/^short/.test(t.dir)?'sell':'buy';
  var ex=t.execs.slice().sort(function(a,b){return(a.date+a.time).localeCompare(b.date+b.time)});
  var eq=0,ep=0,xq=0,xp=0,gross=0,fees=0;
  ex.forEach(function(x){var q=+x.qty,p=+x.price;fees+=q*(+x.fee||0);gross+=(x.side==='sell'?1:-1)*q*p*mult;if(x.side===entrySide){eq+=q;ep+=q*p}else{xq+=q;xp+=q*p}});
  var closed=eq>0&&xq>=eq,avgIn=eq?ep/eq:null,avgOut=xq?xp/xq:null,net=closed?gross-fees:null,amt=avgIn!=null?avgIn*eq*mult:null;
  var first=ex[0],last=ex[ex.length-1];
  return{mult:mult,entrySide:entrySide,ex:ex,eq:eq,xq:xq,closed:closed,avgIn:avgIn,avgOut:avgOut,gross:gross,fees:fees,net:net,
    pct:closed&&amt?net/amt*100:null,result:!closed?'open':net>0?'win':net<0?'loss':'even',
    openDate:first?first.date:null,closeDate:closed?last.date:null,
    holdSec:first&&last?Math.round((new Date(last.date+'T'+last.time)-new Date(first.date+'T'+first.time))/1000):0};
}
function risk(t,c){
  if(t.market!=='option'||c.avgIn==null)return{be:c.avgIn,dte:null,maxP:null,maxL:null};
  var s=+t.strike,p=c.avgIn,q=c.eq,put=/put/.test(t.dir),short=/^short/.test(t.dir);
  var dte=t.expiry&&c.openDate?daysBetween(c.openDate,t.expiry):null,be=put?s-p:s+p,prem=p*q*100;
  var maxP,maxL;
  if(short){maxP=prem;maxL=put?(s-p)*q*100:'Unlimited'}else{maxL=prem;maxP=put?(s-p)*q*100:'Unlimited'}
  return{be:be,dte:dte,maxP:maxP,maxL:maxL};
}
function live(){return state.trades.filter(function(t){return!t.deletedAt})}
function sortedTrades(){return live().map(function(t){return{t:t,c:calc(t)}}).sort(function(a,b){var ad=(a.c.ex[0]?a.c.ex[0].date+a.c.ex[0].time:'9'),bd=(b.c.ex[0]?b.c.ex[0].date+b.c.ex[0].time:'9');return bd.localeCompare(ad)})}
function ledger(){
  var rows=[];
  state.cash.forEach(function(x){rows.push({rank:0,date:x.date,kind:x.type,label:x.type==='deposit'?'Deposit':'Withdrawal',note:x.note,amount:x.type==='deposit'?+x.amount:-x.amount,cash:x})});

  var now=nyNow().date,mo=cal.month||now.slice(0,7),y=+mo.slice(0,4),m=+mo.slice(5),days=new Date(y,m,0).getDate(),first=new Date(y,m-1,1).getDay(),map={};
  sortedTrades().forEach(function(x){if(x.c.closed){var d=x.c.closeDate,e=map[d]||(map[d]={net:0,n:0,list:[]});e.net+=x.c.net;e.n++;e.list.push(x)}});
  function ds(dn){return mo+'-'+String(dn).padStart(2,'0')}
  var mNet=0,mN=0,gd=0,rd=0,lastDay=null;
  for(var d=1;d<=days;d++){var e=map[ds(d)];if(e){mNet+=e.net;mN+=e.n;if(e.net>0)gd++;else if(e.net<0)rd++;lastDay=ds(d)}}
  var sel=cal.sel&&cal.sel.slice(0,7)===mo?cal.sel:lastDay;
  var title=new Date(y,m-1,1).toLocaleString('en-US',{month:'long',year:'numeric'});
  var h='<div class="top"><div><h1>Calendar</h1><p class="sub">Each trade counts on the day it closed, New York time.</p></div></div>';
  h+='<div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px"><div style="display:flex;align-items:center;gap:8px"><button class="btn sm" data-act="calnav" data-d="-1" aria-label="Previous month">‹</button><h2 style="margin:0;min-width:150px;text-align:center">'+title+'</h2><button class="btn sm" data-act="calnav" data-d="1" aria-label="Next month">›</button><button class="btn sm" data-act="caltoday">Today</button></div><p style="font-size:14px">'+(mN?'<span class="'+(mNet>=0?'win':'loss')+'" style="font-weight:600">'+sMoney(mNet)+'</span> · '+mN+(mN===1?' trade':' trades')+' · '+gd+' green, '+rd+' red days':'<span class="mut">No closed trades this month</span>')+'</p></div>';
  h+='<div class="cal">'+DAYN.map(function(n){return'<div class="dh">'+n+'</div>'}).join('')+'<div class="dh">Week</div>';
  var cells=Math.ceil((first+days)/7)*7;
  for(var i=0;i<cells;i++){
    if(i%7===0){var wt=0,wn=0}
    var dn=i-first+1;
    if(dn<1||dn>days){h+='<div class="day mu"></div>'}
    else{var k=ds(dn),e=map[k];if(e){wt+=e.net;wn+=e.n}
      h+='<button class="day'+(e?(e.net>0?' w':e.net<0?' l':''):'')+(k===sel?' sel':'')+(k===now?' today':'')+'" data-act="calday" data-d="'+k+'" aria-label="'+fmtDate(k)+(e?', '+sMoney(e.net)+', '+e.n+' trades':', no trades')+'"><b>'+dn+'</b>'+(e?sMoney(e.net)+'<small><br>'+e.n+(e.n===1?' trade':' trades')+'</small>':'')+'</button>'}
    if(i%7===6){var wk=Math.floor(i/7)+1;h+='<div class="wk"><span class="k">Week '+wk+'</span>'+(wn?'<br><span class="'+(wt>=0?'win':'loss')+'" style="font-weight:600">'+sMoney(wt)+'</span><br><span class="k">'+wn+(wn===1?' trade':' trades')+'</span>':'')+'</div>'}
  }
  h+='</div>';
  var se=sel&&map[sel];
  h+='<div class="sec" style="margin-top:18px"><h2>'+(sel?fmtDate(sel)+(se?' · '+se.n+(se.n===1?' trade':' trades')+' · net '+sMoney(se.net):' · no closed trades'):'Pick a day')+'</h2>';
  if(se){h+='<div class="panel tablewrap"><table class="tbl"><tbody>'+se.list.map(function(x){var t=x.t,c=x.c;return'<tr data-open="'+t.id+'" tabindex="0"><td class="sym">'+esc(t.symbol)+'</td><td>'+esc(typeLabel(t))+'</td><td><span class="pill '+c.result+'">'+({win:'Win',loss:'Loss',even:'Even'})[c.result]+'</span></td><td>'+(t.followed===true?'<span class="win">Followed plan</span>':t.followed===false?'<span class="loss">Off plan</span>':'<span class="mut">Plan not set</span>')+'</td><td class="n '+(c.result==='win'?'win':c.result==='loss'?'loss':'mut')+'">'+sMoney(c.net)+' <span class="mut">'+(c.pct!=null?(c.pct>0?'+':'')+c.pct.toFixed(2)+'%':'')+'</span></td></tr>'}).join('')+'</tbody></table></div>'}
  else h+='<p class="mut">Click a day with a colored tint to see its trades.</p>';
  return h+'</div>';
};

/* trade detail */
function ladder(t){
  var pts=[{k:'Entry',v:+t.stockIn,s:'ring',side:1},{k:'Stop',v:+t.stop,s:'tick',side:0}];
  if(+t.target>0)pts.push({k:'Target',v:+t.target,s:'dia',side:0});
  if(+t.stockOut>0)pts.push({k:'Exit',v:+t.stockOut,s:'dot',side:1});
  var vals=pts.map(function(p){return p.v}),lo=Math.min.apply(null,vals),hi=Math.max.apply(null,vals),pad=((hi-lo)||1)*.14;lo-=pad;hi+=pad;
  pts.forEach(function(p){p.x=40+(p.v-lo)/(hi-lo)*520});pts.sort(function(a,b){return a.x-b.x});
  var last=[[],[]];
  pts.forEach(function(p){var l=0;while(last[p.side][l]!==undefined&&p.x-last[p.side][l]<84)l++;last[p.side][l]=p.x;p.l=l});
  var col={ring:'var(--ink)',tick:'var(--loss)',dia:'var(--win)',dot:'var(--accent)'};
  var g='<line x1="30" y1="56" x2="570" y2="56" stroke="var(--line2)" stroke-width="2"/>';
  pts.forEach(function(p){var c=col[p.s],y=56;
    if(p.s==='ring')g+='<circle cx="'+p.x+'" cy="'+y+'" r="7" fill="var(--panel)" stroke="'+c+'" stroke-width="2.5"/>';
    if(p.s==='tick')g+='<line x1="'+p.x+'" y1="44" x2="'+p.x+'" y2="68" stroke="'+c+'" stroke-width="3.5"/>';
    if(p.s==='dia')g+='<polygon points="'+p.x+','+(y-8)+' '+(p.x+8)+','+y+' '+p.x+','+(y+8)+' '+(p.x-8)+','+y+'" fill="'+c+'"/>';
    if(p.s==='dot')g+='<circle cx="'+p.x+'" cy="'+y+'" r="7" fill="'+c+'"/>';
    var ty=p.side?86+p.l*16:34-p.l*16;
    g+='<text x="'+p.x+'" y="'+ty+'" text-anchor="middle" style="fill:var(--ink)">'+p.k+' '+p.v.toFixed(2)+'</text>'});
  return'<svg viewBox="0 0 600 130" role="img" aria-label="Stock price levels: entry, stop, target and exit">'+g+'</svg>';
}
function execChart(c){
  var ex=c.ex;if(!ex.length)return'';
  var ts=ex.map(function(x){return new Date(x.date+'T'+x.time).getTime()}),ps=ex.map(function(x){return+x.price});
  var t0=Math.min.apply(null,ts),t1=Math.max.apply(null,ts),lo=Math.min.apply(null,ps),hi=Math.max.apply(null,ps);
  var X=function(t){return t1===t0?160:70+(t-t0)/(t1-t0)*180},Y=function(p){return hi===lo?58:92-(p-lo)/(hi-lo)*56};
  var line=ex.map(function(x,i){return X(ts[i]).toFixed(1)+','+Y(ps[i]).toFixed(1)}).join(' ');
  var g='<polyline points="'+line+'" fill="none" stroke="var(--line2)" stroke-width="2"/>';
  ex.forEach(function(x,i){var sell=x.side==='sell',cx=X(ts[i]),cy=Y(ps[i]);g+='<circle cx="'+cx.toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="5" fill="'+(sell?'var(--loss)':'var(--win)')+'"/><text x="'+cx.toFixed(1)+'" y="'+(cy+(sell?-12:20)).toFixed(1)+'" text-anchor="middle" style="fill:var(--ink)">'+(sell?'Sell ':'Buy ')+x.qty+' @ '+num(x.price)+'</text>'});
  g+='<text x="4" y="118">'+fmtTime(ex[0].time)+'</text><text x="316" y="118" text-anchor="end">'+fmtTime(ex[ex.length-1].time)+'</text>';
  return'<svg viewBox="0 0 320 126" role="img" aria-label="Entries and exits over time">'+g+'</svg>';
}

  var c=calc(t),r=risk(t,c),h='',back=view.from||'dashboard';

  h+='<div class="two"><div><h2>Risk and reward</h2><table class="rows">'+
    (t.market==='option'?'<tr><td>Max profit</td><td>'+(typeof r.maxP==='number'?money(r.maxP):esc(r.maxP))+'</td></tr><tr><td>Max loss</td><td>'+(typeof r.maxL==='number'?money(r.maxL):esc(r.maxL))+'</td></tr><tr><td>Breakeven</td><td>'+num(r.be)+'</td></tr><tr><td>Days to expiration at entry</td><td>'+(r.dte==null?'—':r.dte)+'</td></tr>':'<tr><td>Average entry</td><td>'+num(c.avgIn)+'</td></tr>')+
    '<tr><td>Hold</td><td>'+fmtHold(c.holdSec)+'</td></tr><tr><td>Gross</td><td>'+(c.closed?money(c.gross):'—')+'</td></tr><tr><td>Fees</td><td>'+money(c.fees)+'</td></tr></table></div>'+
    '<div><h2>Legs</h2><p style="font-size:14px;margin-bottom:8px">'+esc(typeLabel(t))+' · '+c.eq+(c.eq===1?' contract':' contracts')+(c.avgIn!=null?' · '+(c.entrySide==='sell'?'sold':'bought')+' at '+num(c.avgIn):'')+(c.avgOut!=null?', '+(c.entrySide==='sell'?'bought':'sold')+' at '+num(c.avgOut):'')+'</p><div class="svgbox narrow">'+execChart(c)+'</div></div></div>';
  h+='<div class="sec"><h2>Executions</h2><table class="rows">'+c.ex.map(function(x){return'<tr><td><span class="'+(x.side==='sell'?'loss':'win')+'">'+cap(x.side)+'</span> '+x.qty+' × '+num(x.price)+'</td><td>'+fmtDate(x.date)+' '+fmtTime(x.time)+' · fee '+money((+x.fee||0)*(+x.qty))+'</td></tr>'}).join('')+'</table></div>';
  h+='<div class="sec two"><div><h2>Plan</h2><p style="white-space:pre-wrap">'+(t.plan.trim()?esc(t.plan):'<span class="mut">No plan written.</span>')+'</p>'+(t.planAt?'<p class="hint">Written '+fmtDate(t.planAt.slice(0,10))+' '+fmtTime(t.planAt.slice(11))+(t.planEditedAfterExit?' · <span class="loss">edited after exit</span>':'')+'</p>':'')+'<p style="margin-top:10px">Followed plan: '+(t.followed===true?'<span class="win">Yes</span>':t.followed===false?'<span class="loss">No</span>':'<span class="mut">Not set</span>')+'</p></div><div><h2>Hindsight</h2><p style="white-space:pre-wrap">'+(t.hindsight.trim()?esc(t.hindsight):'<span class="mut">Nothing yet.</span>')+'</p></div></div>';
  h+='<div class="sec"><div class="seg">'+(t.setup?'<span class="chip static">Setup: '+esc(t.setup)+'</span>':'')+(t.emotion?'<span class="chip static">Felt: '+esc(t.emotion)+'</span>':'')+(t.tags||[]).map(function(g){return'<span class="chip static" style="color:var(--loss);border-color:var(--loss)">'+esc(g)+'</span>'}).join('')+'</div>'+(!t.setup&&!t.emotion&&!(t.tags||[]).length?'<p class="mut">No setup, emotion, or tags yet.</p>':'')+'</div>';
  if(t.shots.length)h+='<div class="sec"><h2>Screenshots</h2><div class="shots">'+t.shots.map(function(id){return'<div class="shot"><img data-img="'+id+'" data-act="zoom" alt="Trade screenshot"></div>'}).join('')+'</div></div>';
  return h;
};

function draftFrom(t){var d=JSON.parse(JSON.stringify(t));['strike','stockIn','stop','target','stockOut'].forEach(function(k){d[k]=t[k]===''||t[k]==null?'':String(t[k])});d.execs=d.execs.map(function(x){return Object.assign({},x,{qty:String(x.qty),price:String(x.price),fee:String(x.fee)})});d._orig=t.shots.slice();d._plan0=t.plan;return d}

function renderExecs(){

function renderShots(){
  var el=$('#shots');if(!el)return;
  el.innerHTML=draft.shots.map(function(id){return'<div class="shot"><img data-img="'+id+'" data-act="zoom" alt="Screenshot"><button type="button" data-act="rmshot" data-id="'+id+'" aria-label="Remove screenshot">×</button></div>'}).join('');hydrate();

function addFiles(files){
  if(view.name!=='form'||!draft)return;
  var jobs=Array.from(files).filter(function(f){return/^image\//.test(f.type)}).map(function(f){return compress(f).then(function(b){var id='i'+uid();return dbPut('img',id,b).then(function(){draft.shots.push(id)})}).catch(function(){toast("Couldn't add that image")})});
  Promise.all(jobs).then(renderShots);
}
function validate(d){
  var e=[];if(!d.symbol.trim())e.push('Enter a symbol.');
  if(d.market==='option'){if(!(+d.strike>0))e.push('Enter the strike.');if(!d.expiry)e.push('Enter the expiration date.')}
  if(!(+d.stockIn>0))e.push('Enter the stock price at entry.');if(!(+d.stop>0))e.push('Enter your stop.');
  d.execs.forEach(function(x,i){if(!x.date||!x.time||!(+x.qty>0)||x.price===''||!(+x.price>=0))e.push('Execution '+(i+1)+': enter the date, time, quantity, and price.')});
  if(!d.execs.some(function(x){return x.side===entrySide(d)}))e.push('Add the entry execution ('+entrySide(d)+').');
  return e;
}
function saveTrade(){
  var d=draft,errs=validate(d),box=$('#errs');
  if(errs.length){box.innerHTML='<div class="callout bad" role="alert"><div>Fix this to save:<ul>'+errs.map(function(m){return'<li>'+esc(m)+'</li>'}).join('')+'</ul></div></div>';window.scrollTo(0,0);return}

    if (!window.auth.currentUser) return;
    try {
      await setDoc(doc(window.db, "backups", "journal_state"), {
        data: journalState,
        lastUpdated: new Date()
      });
      console.log("Cloud backup synced to Firestore!");
    } catch (err) {
      console.error("Cloud sync failed:", err);
    }
  };

  // Protected Restore Function
  window.cloudRestoreState = async function() {
    if (!window.auth.currentUser) return null;
    try {
      const docRef = doc(window.db, "backups", "journal_state");
      const docSnap = await getDoc(docRef);
      return docSnap.exists() ? docSnap.data().data : null;
    } catch (err) {
      console.error("Cloud restore failed:", err);
      return null;
    }
  };

</script>
</script>
